# yaml-embedded-languages: sql
#
# Revision 3 ships the consolidated definition r2 promised with `override`.
# None of the five child mutations from r1 and r2 are restated: r2's `delete`
# already forgot them, so they simply drop out instead of being taken down one
# by one.
#
# `customers.revision_check` is a test for the revision itself: its checks
# fail the whole apply if the two rows seeded back in r1 did not survive the
# trip through r2, if the name split lost data, or if a column that should be
# gone (`full_name`, `phone`, `signed_up_at`) is still there. It is a default
# (non-structural) mutation, so dmut reapplies it whenever `customers` is.

revision: 3
namespace: crm

mutations:
  # Exactly what r2 promised with `override`, seed included.
  customers:
    structural: true
    sql:
      - |
        create table customers (
          id serial primary key,
          first_name text,
          last_name text,
          email text not null unique,
          created_at timestamptz not null default now(),
          marketing_opt_in boolean not null default false
        );
      - seed: |
          insert into customers (first_name, last_name, email) values
            ('Jane', 'Cooper', 'jane@example.com'),
            ('Wade', 'Warren', 'wade@example.com')
          on conflict (email) do nothing

  customers.revision_check:
    sql:
      - check: select count(*) = 2 from customers
      - check: select exists (select 1 from customers where first_name = 'Jane' and last_name = 'Cooper' and email = 'jane@example.com')
      - check: select exists (select 1 from customers where first_name = 'Wade' and last_name = 'Warren' and email = 'wade@example.com')
      - check: select coalesce(bool_and(not marketing_opt_in), true) from customers
      - check: |
          select not exists (
            select 1 from information_schema.columns
            where table_name = 'customers' and column_name in ('full_name', 'phone', 'signed_up_at')
          )
