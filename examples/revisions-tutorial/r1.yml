# yaml-embedded-languages: sql
#
# A messier, more realistic revisions story than examples/revisions: instead
# of one column added after the fact, `customers` picks up five separate
# changes "over the years" (new columns, a data migration that drops a
# column, and a rename), each written the way it would actually have
# happened, as its own small mutation, without editing the ones before it.
#
# Run this with `dmut test -a examples/revisions-tutorial` to replay
# r1 -> r2 -> r3 in order, the way an existing production database would.

revision: 1
namespace: crm

mutations:
  customers:
    structural: true
    sql:
      - |
        create table customers (
          id serial primary key,
          full_name text not null,
          email text not null unique,
          signed_up_at timestamptz not null default now()
        );
      # Seed data runs before the child mutations below (including the one
      # that drops `full_name`), because they depend on `customers`.
      - seed: |
          insert into customers (full_name, email) values
            ('Jane Cooper', 'jane@example.com'),
            ('Wade Warren', 'wade@example.com')
          on conflict (email) do nothing

  # Year one: a phone number field, nobody thought too hard about it.
  customers.phone:
    structural: true
    sql:
      - alter table customers add column phone text

  # Year two: an opt-in flag for a marketing campaign.
  customers.marketing_opt_in:
    structural: true
    sql:
      - alter table customers add column marketing_opt_in boolean not null default false

  # Year three: `full_name` turned out to be the wrong shape; reports needed
  # first and last name separately. This is the interesting one: the backfill
  # and the drop of the old column cannot be inferred, so they are explicit
  # up/down pairs. Downs run in the reverse order of the statements, so
  # downing this mutation re-adds `full_name`, recomputes it from the two new
  # columns, and only then drops them: a real, working down.
  customers.split_name:
    structural: true
    sql:
      - alter table customers add column first_name text
      - alter table customers add column last_name text
      - up: |
          update customers set
            first_name = split_part(full_name, ' ', 1),
            last_name = nullif(split_part(full_name, ' ', 2), '')
        down: |
          update customers set full_name = trim(coalesce(first_name, '') || ' ' || coalesce(last_name, ''))
      - up: alter table customers drop column full_name
        down: alter table customers add column full_name text

  # Year four: phone turned out to be unused (nothing ever texted anyone), so
  # it was dropped. It depends on `customers.phone` explicitly: a dotted name
  # only depends on its own ancestors, never on a sibling, so without this the
  # column it drops might not exist yet when it runs.
  customers.retire_phone:
    structural: true
    deps: [customers.phone]
    sql:
      - up: alter table customers drop column phone
        down: alter table customers add column phone text

  # Year five: a naming-convention cleanup, unrelated to everything above.
  customers.rename_signup:
    structural: true
    sql:
      - alter table customers rename column signed_up_at to created_at
