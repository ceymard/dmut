# yaml-embedded-languages: sql
#
# A messier, more realistic revisions story than examples/revisions: instead
# of one column added after the fact, `customers` picks up five separate
# changes "over the years" - new columns, a data migration that drops a
# column, and a rename - each written the way it would actually have
# happened, as its own small mutation, without editing the ones before it.
#
# Run this with `dmut test -a examples/revisions-tutorial` to replay
# r1 -> r2 -> r3 in order, the way an existing production database would.

__namespace: crm
__revision: 1

customers:
  core:
    - |
      create table customers (
        id serial primary key,
        full_name text not null,
        email text not null unique,
        signed_up_at timestamptz not null default now()
      );
    # Seed data, deliberately in `core` and not `glue`: every child mutation
    # below (including the one that drops `full_name`) depends on `customers`
    # and therefore runs after this mutation's own `core` list finishes - but
    # *all* `core` in the namespace always runs before *any* `glue`, children
    # included. Seeding through `glue` here would insert these rows after
    # `full_name` was already dropped, and fail outright. This is the one
    # place in this file where data lives in `core` instead of `glue` - see
    # "core vs glue" in the docs for the usual rule, and treat this as the
    # exception that proves it: ordering, not weight, is what actually
    # decided it here.
    - up: |
        insert into customers (full_name, email) values
          ('Jane Cooper', 'jane@example.com'),
          ('Wade Warren', 'wade@example.com');
      down: delete from customers where email in ('jane@example.com', 'wade@example.com');

  children:
    # Year one: a phone number field, nobody thought too hard about it.
    phone:
      core:
        - alter table customers add column phone text;

    # Year two: an opt-in flag for a marketing campaign.
    marketing_opt_in:
      core:
        - alter table customers add column marketing_opt_in boolean not null default false;

    # Year three: `full_name` turned out to be the wrong shape - reports
    # needed first/last name separately. This is the interesting one: the
    # backfill (an UPDATE) has no auto-down at all, and dropping the old
    # column has no auto-down either dmut is willing to guess at, so both
    # live in the same explicit up/down pair. Because down statements run in
    # the *reverse* order of the up list within one mutation (see "Automatic
    # down statements" in the docs), downing this mutation re-adds
    # `full_name`, recomputes it from the two new columns, and only then
    # drops them - a real, working down, not just a schema-shape mirror.
    split_name:
      core:
        - alter table customers add column first_name text;
        - alter table customers add column last_name text;
        - up: |
            update customers set
              first_name = split_part(full_name, ' ', 1),
              last_name = nullif(split_part(full_name, ' ', 2), '');
            alter table customers drop column full_name;
          down: |
            alter table customers add column full_name text;
            update customers set full_name = trim(coalesce(first_name, '') || ' ' || coalesce(last_name, ''));

    # Year four: phone turned out to be unused (nothing ever texted anyone),
    # so it was dropped. Needs `customers.phone` explicitly - dotted names
    # only ever depend on their own ancestors, never on a sibling, so without
    # this the column this mutation drops might not exist yet when it runs.
    retire_phone:
      needs: [customers.phone]
      core:
        - up: alter table customers drop column phone;
          down: alter table customers add column phone text;

    # Year five: a naming-convention cleanup, unrelated to everything above.
    rename_signup:
      core:
        - alter table customers rename column signed_up_at to created_at;
