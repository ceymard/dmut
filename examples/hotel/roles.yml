# yaml-embedded-languages: sql
namespace: hotel

# Lets an unauthenticated client (e.g. rel's own "~anonymous" role, see
# docs/http/authentication.md in the rel project) read and write this schema.
#
# Not named `hotel.roles`: a role is cluster-wide, not an object that lives
# in the `hotel` schema, so it's kept flat - same reasoning as `extensions`.
structural: true
sql:
  - create role "~anonymous";
