# yaml-embedded-languages: sql
__namespace: hotel

hotel.loyalty_tiers:
  core:
    - |
      create table hotel.loyalty_tiers (
        id bigint generated always as identity primary key,
        name text not null unique,
        min_points integer not null default 0
      );

  glue:
    - comment on table hotel.loyalty_tiers is 'Loyalty program tiers, looked up by name - deliberately a lookup table rather than an enum.';
