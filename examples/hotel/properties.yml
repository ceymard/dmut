# yaml-embedded-languages: sql
__namespace: hotel

hotel.properties:
  needs: [hotel.chains]

  core:
    - |
      create table hotel.properties (
        id bigint generated always as identity primary key,
        chain_id bigint references hotel.chains (id),
        name text not null,
        location point,
        star_rating smallint check (star_rating between 1 and 5),
        description text,
        created_at timestamptz not null default now()
      );
    - create index properties_chain_id_idx on hotel.properties (chain_id);

  # A stored generated column plus its GIN index, kept as a child mutation of its
  # own rather than folded into `sql` above: it exists purely so full-text search
  # has something cheap to index, and it's a natural seam to alter or drop later
  # without touching the table's own definition.
  children:
    description_search:
      core:
        - |
          alter table hotel.properties add column description_search tsvector
            generated always as (to_tsvector('english', coalesce(description, ''))) stored;
        - create index properties_description_search_idx on hotel.properties using gin (description_search);

  glue:
    - comment on table hotel.properties is 'A single hotel property belonging to a chain.';

    # Table-valued/SETOF function: a joinable/selectable node in its own right,
    # not a computed column. Reads the FTS column added by the child mutation
    # above - safe, since all `sql` (including children) runs before any `meta`.
    - |
      create function hotel.search_properties(query text) returns setof hotel.properties
      language sql stable as $$
        select * from hotel.properties
        where description_search @@ websearch_to_tsquery('english', query)
      $$;
