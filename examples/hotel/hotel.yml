# yaml-embedded-languages: sql
namespace: hotel

# The schema itself. Named `hotel`, not `schema`, so that every mutation named
# `hotel.<something>` depends on it automatically (a dotted name depends on its
# existing parent). Types are named `hotel.types.<name>`; no `hotel.types`
# mutation has to exist for that to work.
structural: true
sql:
  - create schema hotel;
