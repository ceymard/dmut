# yaml-embedded-languages: sql
#
# A worked revisions example: the same story as examples/hotel/properties.yml's
# `description_search` mutation (a stored generated column added after the
# fact, for full-text search), but told across three revisions of the same
# table instead of being written in its final shape from the start.
#
# Run this with `dmut test -a examples/revisions` to replay r1 -> r2 -> r3 in
# order, the way an existing production database would actually walk it.

revision: 1
namespace: revisions

mutations:
  properties:
    structural: true
    sql:
      - |
        create table properties (
          id serial primary key,
          name text not null,
          description text
        );
      # A seed has no down and must be safe to run twice.
      - seed: |
          insert into properties (name, description)
          select v.name, v.description
          from (values
            ('Seaside Inn', 'A quiet hotel by the sea with a pool and lovely staff.'),
            ('Mountain Lodge', 'A cozy retreat with mountain views and a fireplace.')
          ) as v (name, description)
          where not exists (select 1 from properties p where p.name = v.name)
