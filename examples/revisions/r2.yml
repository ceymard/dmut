# yaml-embedded-languages: sql
#
# Revision 2 adds full-text search over `description` as its own mutation, an
# ALTER TABLE ADD COLUMN kept separate from the table's definition. Its dotted
# name makes it depend on `properties` automatically.
#
# `mutations` is what really runs on a database that sits at revision 1.
# `override` is what dmut records for `properties` instead: the column folded
# straight into CREATE TABLE, as if it had been there from the start.
#
# The override has to match revision 3's `properties` exactly, index and seed
# included. It replaces the whole recorded mutation (statements, flags and
# dependencies), so everything that should be kept is restated. That way a
# database that stops at revision 2 and one that jumps to revision 3 hold the
# same definition, and dmut sees no difference between them.
#
# `delete` forgets the child mutation once its column is folded into the
# override. It already ran for real via `mutations`, and forgetting it does
# not drop the column.

revision: 2
namespace: revisions

delete: [properties.description_search]

override:
  properties:
    structural: true
    sql:
      - |
        create table properties (
          id serial primary key,
          name text not null,
          description text,
          description_search tsvector
            generated always as (to_tsvector('english', coalesce(description, ''))) stored
        );
      - create index properties_description_search_idx on properties using gin (description_search)
      - seed: |
          insert into properties (name, description)
          select v.name, v.description
          from (values
            ('Seaside Inn', 'A quiet hotel by the sea with a pool and lovely staff.'),
            ('Mountain Lodge', 'A cozy retreat with mountain views and a fireplace.')
          ) as v (name, description)
          where not exists (select 1 from properties p where p.name = v.name)

mutations:
  # What still has to run for a database at revision 1: unchanged from r1.yml,
  # because the column is added by the child mutation below.
  properties:
    structural: true
    sql:
      - |
        create table properties (
          id serial primary key,
          name text not null,
          description text
        );
      - seed: |
          insert into properties (name, description)
          select v.name, v.description
          from (values
            ('Seaside Inn', 'A quiet hotel by the sea with a pool and lovely staff.'),
            ('Mountain Lodge', 'A cozy retreat with mountain views and a fireplace.')
          ) as v (name, description)
          where not exists (select 1 from properties p where p.name = v.name)

  properties.description_search:
    structural: true
    sql:
      - |
        alter table properties add column description_search tsvector
          generated always as (to_tsvector('english', coalesce(description, ''))) stored
      - create index properties_description_search_idx on properties using gin (description_search)
