# yaml-embedded-languages: sql

__namespace: test
__revision: 3

test:
  core:
    - |
      create table test (
        id serial primary key,
        name text not null,
        age integer not null default 0
      );

    # Verify that no data was lost during the mutations
    - up: |
        do $$
        declare
          v_count integer;
        begin
          v_count := (select count(*) from test);
          if v_count is null then
            raise exception 'test should not be empty - test table was most likely dropped when it should not have been';
          end if;
          raise notice 'there was % rows in test', v_count;
        end $$ language plpgsql;

  glue:
    - |
      create view test_view as select age from test;
