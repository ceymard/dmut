[project]
docs_dir = "content"
site_url = "https://ceymard.github.io/dmut/"
site_name = "Dmut"
site_description = "Dependency-based database schema migrations for Postgres"
repo_url = "https://github.com/ceymard/dmut"
repo_name = "ceymard/dmut"
edit_uri = "edit/main/docs/content/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
      { "Overview" = "getting-started/index.md" },
      { "Installation" = "getting-started/installation.md" },
      { "CLI reference" = "getting-started/cli-reference.md" },
      { "How a run works" = "getting-started/how-a-run-works.md" },
  ] },
  { "Mutation format" = [
      { "Overview" = "mutation-format/index.md" },
      { "core vs glue" = "mutation-format/core-vs-glue.md" },
      { "Automatic down statements" = "mutation-format/auto-down.md" },
      { "Naming rules and children" = "mutation-format/naming-rules.md" },
      { "Namespaces" = "mutation-format/namespaces.md" },
      { "Collecting and exploding" = "mutation-format/collect-explode.md" },
  ] },
  { "Revisions" = [
      { "Overview" = "revisions/index.md" },
      { "Worked example" = "revisions/worked-example.md" },
      { "Tutorial: consolidating years of ALTER TABLE" = "revisions/tutorial.md" },
  ] },
  { "Example database" = [
      { "Overview" = "example-database/index.md" },
      { "Schema reference" = "example-database/reference.md" },
      { "Walkthrough" = "example-database/walkthrough.md" },
  ] },
  { "Considerations" = "considerations.md" },
]

[project.theme]
name = "material"
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.mark = {}
pymdownx.snippets = { base_path = ["..", "."] }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
tables = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
