name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          name="dmut-${{ matrix.os }}-${{ matrix.arch }}"
          bin="dmut"
          if [ "${{ matrix.os }}" = "windows" ]; then bin="dmut.exe"; fi
          go build -ldflags "-s -w" -o "$bin" .
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "${name}.zip" "$bin"
          else
            tar -czf "${name}.tar.gz" "$bin"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dmut-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dmut-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            dmut-${{ matrix.os }}-${{ matrix.arch }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
