namespace: __dmut__
structural: true
deps: [dmut.mutations]
sql:
  - |
    create table __dmut__.deps (
      namespace text not null,
      mutation text not null,
      position int not null,
      entry text not null,
      reapply_on text[],
      matched text[] not null,

      primary key (namespace, mutation, position),
      foreign key (namespace, mutation) references __dmut__.mutations (namespace, name) on delete cascade
    )
